<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>朱先生 · 产品总监 · 智能硬件 / IoT 平台 / AI Agent</title>
<meta name="description" content="11 年产品经验：运营商家庭终端、物流车联网、公寓集团 IoT 设备管理平台，现负责出茶机等智能设备产品线；可在线试用客户情报、后台操作、门店设备运维 3 个 Agent。">
<meta name="theme-color" content="#050806">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%2339ff88%27/%3E%3C/svg%3E">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --bg:#050806;--surface:#09110c;--surface-2:#0c1610;--surface-3:#112019;
  --line:#193a29;--line-2:#2a5a40;--line-soft:#11261a;
  --text:#e3efe7;--text-2:#a9bfb1;--text-3:#7a9584;
  --accent:#39ff88;--accent-2:#22c76a;--accent-ink:#032412;--accent-soft:rgba(57,255,136,.08);--accent-line:rgba(57,255,136,.34);
  --cyan:#38bdf8;--amber:#f2c14e;--red:#ff6b6b;--violet:#a78bfa;
  --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --shell:1180px;--gutter:clamp(16px,4vw,40px);--r:12px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--font-sans);
  background-image:linear-gradient(rgba(57,255,136,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,136,.03) 1px,transparent 1px);background-size:48px 48px;background-attachment:fixed}
h1,h2,h3,h4,p,ol,ul{margin:0}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--font-mono)}
.shell{max-width:var(--shell);margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── 进度条 ── */
#progress{position:fixed;left:0;top:0;height:2px;width:0;z-index:60;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 10px var(--accent)}

/* ── 顶栏 ── */
.nav{position:sticky;top:0;z-index:40;background:rgba(5,8,6,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .shell{display:flex;align-items:center;gap:14px;height:58px}
.brand{font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.links{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{position:relative;padding:7px 11px;border-radius:8px;color:var(--text-2);font-size:14px;white-space:nowrap}
.links a:hover{color:var(--text);background:var(--surface-2)}
.links .sep{flex:none;width:1px;height:18px;background:var(--line-2);margin:0 6px}
.links a.lab{color:var(--accent);font-weight:600;padding:6px 12px;border:1px solid transparent;border-radius:999px;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--a),var(--line-2) 0 70%,var(--accent) 85%,var(--line-2) 100%) border-box;animation:beam 3s linear infinite}
.links a.lab em{font:700 9px/1 var(--font-mono);font-style:normal;padding:3px 5px;border-radius:4px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:2px}
.links a[aria-current="page"]:not(.lab){color:var(--accent)}
.links a[aria-current="page"].lab{background:linear-gradient(#0f2a1b,#0f2a1b) padding-box,conic-gradient(from var(--a),var(--accent-2) 0 60%,#b6ffd3 80%,var(--accent-2) 100%) border-box}
@keyframes beam{to{--a:360deg}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-size:14px;white-space:nowrap;transition:border-color .2s,background .2s,box-shadow .2s,transform .2s}
.btn:hover{border-color:var(--accent-line);background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#6dffa8;box-shadow:0 0 24px var(--accent-line);transform:translateY(-1px)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav .btn{flex:none}

/* ── 通用 ── */
section{padding-top:56px;padding-bottom:56px}
.kicker{font:600 12px var(--font-mono);letter-spacing:.16em;color:var(--accent);display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:1px;background:var(--accent)}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sec-h h2{font-size:clamp(24px,3vw,30px)}
.sec-h .en{font:500 12px var(--font-mono);letter-spacing:.18em;color:var(--text-3)}
.sec-sub{color:var(--text-2);margin:0 0 22px;max-width:780px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* 跟随鼠标的光斑 + 悬停时沿边框转动的光线 */
.glow{position:relative;isolation:isolate;transition:border-color .3s,box-shadow .3s,transform .3s}
.glow::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(57,255,136,.10),transparent 45%)}
.glow::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .35s;
  background:conic-gradient(from var(--a),transparent 0 70%,var(--accent) 86%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:beam 3.2s linear infinite}
.glow:hover{border-color:var(--line-2);box-shadow:0 14px 44px -22px var(--accent-line)}
.glow:hover::before,.glow:hover::after{opacity:1}
/* 滚动进场 */
.js .rv{opacity:0;transform:translateY(22px)}
.rv.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}

/* ── 首屏 ── */
.hero{position:relative;padding-top:64px;padding-bottom:40px;overflow:hidden}
#net{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center}
.hero h1{margin-top:18px;font-size:clamp(38px,5.4vw,64px);line-height:1.12}
.role{display:block;font-size:clamp(20px,2.6vw,30px);font-weight:600;color:var(--text-2);margin-top:10px;min-height:1.4em}
.role #typed{color:var(--accent);text-shadow:0 0 24px var(--accent-line)}
.caret{display:inline-block;width:.5em;height:.95em;margin-left:4px;vertical-align:-.1em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{margin-top:18px;color:var(--text-2);max-width:600px}
.cta{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px}
.radar{position:relative;width:min(100%,400px);aspect-ratio:1;margin-left:auto}
.radar svg{position:absolute;inset:0;width:100%;height:100%}
.radar .sw{position:absolute;inset:4%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,rgba(57,255,136,0) 290deg,var(--accent-line) 359deg,var(--accent) 360deg);opacity:.55;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 69%,transparent 70%);mask:radial-gradient(circle,#000 69%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);white-space:nowrap}
.blip i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.35;flex:none;animation:ping 6s linear infinite;animation-delay:var(--t)}
.blip span{animation:label 6s linear infinite;animation-delay:var(--t)}
.blip.l{flex-direction:row-reverse}
@keyframes ping{0%{opacity:1;box-shadow:0 0 0 0 var(--accent-line),0 0 12px var(--accent);transform:scale(1.5)}25%{opacity:.6;box-shadow:0 0 0 10px transparent;transform:scale(1)}100%{opacity:.35;transform:scale(1)}}
@keyframes label{0%{color:var(--accent)}35%,100%{color:var(--text-3)}}
.radar-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font:600 11px/1.3 var(--font-mono);color:var(--text-3);letter-spacing:.1em}
.radar-core b{display:block;font-size:13px;color:var(--accent)}
.nums{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:44px;background:rgba(9,17,12,.85);backdrop-filter:blur(4px)}
.num{padding:20px 22px}
.num+.num{border-left:1px solid var(--line-soft)}
.num b{display:block;font:700 clamp(26px,3.4vw,38px)/1.1 var(--font-mono);color:var(--accent);text-shadow:0 0 18px var(--accent-line);font-variant-numeric:tabular-nums}
.num b small{font-size:.45em;color:var(--text-3);margin-left:3px;text-shadow:none}
.num>span{display:block;margin-top:6px;font-size:13px;color:var(--text-2)}

/* ── 首页 Agent 入口 ── */
.teasers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.teaser{display:flex;flex-direction:column;gap:10px;padding:18px}
.teaser .no{font:600 12px var(--font-mono);color:var(--accent)}
.teaser h3{font-size:18px}
.teaser p{font-size:14px;color:var(--text-2)}
.mini{height:118px;border:1px solid var(--line-soft);border-radius:8px;background:#030604;padding:10px 12px;font:12px/1.75 var(--font-mono);color:var(--text-3);overflow:hidden}
.mini div{animation:logIn .35s var(--ease) both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .g{color:var(--accent)}.mini .y{color:var(--amber)}.mini .r{color:var(--red)}.mini .c{color:var(--cyan)}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}}
.teaser .go{margin-top:auto;font-size:13px;color:var(--accent);display:flex;align-items:center;gap:6px}
.teaser .go i{transition:transform .2s;font-style:normal}
.teaser:hover .go i{transform:translateX(4px)}

/* ── 项目 ── */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.proj{padding:22px;display:flex;flex-direction:column;gap:16px}
.proj-h{display:flex;gap:14px;align-items:flex-start}
.proj-h .no{font:600 12px var(--font-mono);color:var(--accent)}
.proj-h h3{font-size:18px;margin-top:2px}
.proj-h .meta{font-size:12.5px;color:var(--text-3);margin-top:4px}
.proj-h .kpi{margin-left:auto;text-align:right;flex:none}
.proj-h .kpi b{display:block;font:700 28px/1.1 var(--font-mono);color:var(--accent);text-shadow:0 0 18px var(--accent-line)}
.proj-h .kpi small{font-size:12px;color:var(--text-2)}
.flow{--step:.7s;display:flex;align-items:center}
.fnode{flex:1 1 0;min-width:0;padding:8px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface-2);text-align:center;font-size:12px;line-height:1.35;font-weight:600;
  animation:nodeOn calc(var(--n) * var(--step)) linear infinite;animation-delay:calc(var(--i) * var(--step))}
@keyframes nodeOn{0%,16%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 22px var(--accent-line);color:var(--accent)}30%,100%{border-color:var(--line-2);box-shadow:none}}
.flink{flex:0 0 22px;height:1px;background:var(--line-2);position:relative;overflow:hidden}
.flink::after{content:"";position:absolute;top:-1px;left:-40%;width:40%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:packet calc(var(--n) * var(--step)) linear infinite;animation-delay:calc(var(--i) * var(--step) + var(--step) * .3)}
@keyframes packet{0%{left:-40%}14%{left:100%}100%{left:100%}}
.points{list-style:none;padding:0;display:grid;gap:8px;font-size:14px;color:var(--text-2)}
.points li{position:relative;padding-left:16px}
.points li::before{content:"›";position:absolute;left:2px;color:var(--accent);font-weight:700}

/* ── 经历时间线 ── */
.tl{position:relative;padding-left:34px}
.tl-track{position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-track i{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(var(--accent-2),var(--accent));box-shadow:0 0 12px var(--accent)}
.tli{position:relative;padding:0 0 26px}
.tli::before{content:"";position:absolute;left:-30px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);transition:all .4s}
.tli.on::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 14px var(--accent)}
.tli .t{font:12.5px var(--font-mono);color:var(--accent)}
.tli h3{font-size:17px;margin:4px 0 6px}
.tli h3 span{font-size:13px;font-weight:500;color:var(--text-3);margin-left:8px}
.tli p{font-size:14px;color:var(--text-2);max-width:820px}

/* ── 技能 ── */
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);margin-bottom:22px}
.track{display:flex;gap:10px;width:max-content;animation:marq 36s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{font-size:14px;padding:8px 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface-2);white-space:nowrap}
.track span.hot{border-color:var(--accent-line);color:var(--accent)}
@keyframes marq{to{transform:translateX(-50%)}}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.skill{padding:18px}
.skill h3{font-size:15px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:5px;color:var(--text-2);background:var(--surface-2)}
.contact{padding:26px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.contact p{color:var(--text-2)}
.contact b{font:600 18px var(--font-mono);color:var(--accent)}
footer{padding:28px 0 48px;color:var(--text-3);font-size:12.5px;text-align:center}

/* ═════════════ Agent 实验室 ═════════════ */
.lab-head{padding-top:30px;padding-bottom:14px}
.lab-head h1{font-size:clamp(30px,4.4vw,46px);margin-top:12px;line-height:1.15}
.lab-head h1 span{color:var(--accent);text-shadow:0 0 24px var(--accent-line)}
.lab-head p{margin-top:10px;color:var(--text-2);max-width:940px}
.lab-sec{padding-top:12px;padding-bottom:12px}
.sub-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sub-h h2{font-size:17px}
.sub-h small{color:var(--text-3);font-size:13px}

/* 能力地图 */
.matrix-wrap{overflow-x:auto;scrollbar-width:thin}
.matrix{width:100%;min-width:860px;border-collapse:separate;border-spacing:0;font-size:13px}
.matrix th,.matrix td{padding:7px 4px;border-bottom:1px solid var(--line-soft);text-align:center;vertical-align:middle}
.matrix thead th{font-weight:600;color:var(--text);font-size:13px;line-height:1.3;cursor:help}
.matrix thead th small{display:block;font-weight:400;color:var(--text-3);font-size:11.5px;margin-top:2px}
.matrix tbody th{padding-left:14px;text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.matrix tbody th button{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--text)}
.matrix tbody th button small{display:block;font-weight:400;color:var(--text-3);font-size:11.5px}
.matrix tbody tr:last-child>*{border-bottom:0}
.matrix tr.cur th button{color:var(--accent)}
.cell{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 4px;color:var(--text-2);font-size:12px;line-height:1.3;transition:all .2s}
.cell i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 10px var(--accent-line);position:relative}
.cell:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--text)}
.cell:hover i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--accent);animation:ring 1s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.none{color:var(--line-2)}
.matrix th.capcol.hi{color:var(--accent)}

/* Agent 选择 */
.atabs{display:flex;gap:8px;flex-wrap:wrap}
.atab{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:all .25s}
.atab .no{font:600 11.5px var(--font-mono);color:var(--text-3)}
.atab b{font-size:14.5px}
.atab em{font-style:normal;font-size:11.5px;color:var(--accent);border:1px solid var(--accent-line);border-radius:99px;padding:0 7px}
.atab:hover{border-color:var(--line-2)}
.atab[aria-selected="true"]{border-color:var(--accent);background:#0f2a1b;box-shadow:0 0 0 1px var(--accent-line),0 0 24px -8px var(--accent)}
.atab[aria-selected="true"] .no,.atab[aria-selected="true"] b{color:var(--accent)}
.now{margin-top:10px;font-size:13.5px;color:var(--text-2)}
.now b{color:var(--text)}

/* 控制条 */
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.ctl .state{font:12px var(--font-mono);color:var(--text-3);display:flex;align-items:center;gap:6px;margin-right:4px}
.ctl .state i{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.ctl .state.on i{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1s infinite}
.ctl .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface-2);border:0;padding:0 10px;min-height:32px;font:12px var(--font-mono);color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.modes{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.modes button{background:var(--surface-2);border:0;padding:0 12px;min-height:34px;font-size:13px;color:var(--text-2)}
.modes button[aria-pressed="true"]{background:var(--surface-3);color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.modes button[disabled]{opacity:.5;cursor:not-allowed}

/* 进度条（每个点是一项能力出现的位置） */
.scrub{position:relative;height:26px;margin:4px 0 12px;cursor:pointer}
.scrub .bar{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.scrub .fill{position:absolute;left:0;top:12px;height:2px;width:0;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:width .35s var(--ease)}
.scrub .mk{position:absolute;top:6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--line-2);background:var(--bg);padding:0}
.scrub .mk.done{border-color:var(--accent);background:var(--accent-ink)}
.scrub .mk:hover::after{content:attr(data-l);position:absolute;bottom:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--text)}

/* 工作台：对话 + 幕后 */
.bench{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:14px;height:min(720px,calc(100svh - 120px));min-height:560px}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--text-2)}
.pane-h b{color:var(--text);font-size:14px}
.pane-h .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.pane-h .r{margin-left:auto;font:12px var(--font-mono);color:var(--text-3)}
.mtabs{display:none}
.ticker{display:none}

/* 对话 */
.chat{position:relative;flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat-empty{margin:auto;text-align:center;color:var(--text-3);font-size:13px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:92%;animation:logIn .35s var(--ease) both}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:12px;color:var(--c,var(--accent));display:flex;align-items:center;gap:6px}
.msg .who::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 6px var(--c,var(--accent))}
.bubble{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.me .bubble{background:#0f2a1b;border-color:var(--accent-line)}
.fref{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin:0 2px;border-radius:5px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font:600 11px var(--font-mono);vertical-align:2px}
.fref:hover{background:var(--accent);color:var(--accent-ink)}
.alert{border:1px solid rgba(255,107,107,.5);background:rgba(255,107,107,.07);border-radius:10px;padding:10px 12px;font-size:14px;animation:logIn .35s var(--ease) both,alertGlow 1.6s ease-in-out 2}
.alert b{color:var(--red);margin-right:8px;font-family:var(--font-mono);font-size:12px}
@keyframes alertGlow{50%{box-shadow:0 0 0 3px rgba(255,107,107,.15),0 0 26px rgba(255,107,107,.25)}}
.toolline{align-self:flex-start;font:12px var(--font-mono);color:var(--text-3);display:flex;align-items:center;gap:8px;padding:3px 10px;border:1px dashed var(--line-2);border-radius:999px;animation:logIn .3s var(--ease) both}
.toolline.done{color:var(--text-2);border-style:solid;border-color:var(--line)}
.ok{color:var(--accent);font-weight:700}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none;display:inline-block}
.handoff{align-self:center;display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);animation:logIn .35s var(--ease) both}
.handoff span{color:var(--c)}
.handoff i{font-style:normal;color:var(--text-3)}
.handoff em{font-style:normal;color:var(--text-3)}
.guardnote{align-self:stretch;font-size:13px;color:#ffc0c0;border:1px solid rgba(255,107,107,.45);background:rgba(255,107,107,.08);border-radius:10px;padding:8px 12px;animation:logIn .3s var(--ease) both}
.outcard{border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);padding:12px;font-size:13.5px;line-height:1.65}
.outcard h4{font-size:13px;color:var(--accent);margin-bottom:6px;font-family:var(--font-mono);font-weight:600}
.outcard ol,.outcard ul{padding-left:18px;display:grid;gap:3px}
.outcard q{quotes:none;color:var(--amber);border-bottom:1px dashed var(--amber)}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.chart text{font:10px var(--font-mono);fill:var(--text-3)}
.approve{border:1px solid rgba(242,193,78,.55);background:rgba(242,193,78,.06);border-radius:12px;padding:12px;animation:logIn .35s var(--ease) both}
.approve.wait{animation:logIn .35s var(--ease) both,waitGlow 1.4s ease-in-out infinite}
@keyframes waitGlow{50%{box-shadow:0 0 0 3px rgba(242,193,78,.14),0 0 26px rgba(242,193,78,.2)}}
.approve h4{font-size:13px;color:var(--amber);margin-bottom:4px}
.approve p{font-size:13.5px;color:var(--text)}
.approve .why{font-size:12.5px;color:var(--text-2);margin-top:4px}
.approve .act{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.approve .act small{color:var(--text-3);font-size:12px}
.approve.ok{border-color:var(--accent-line);background:var(--accent-soft)}
.approve.ok h4{color:var(--accent)}
.endline{align-self:center;font-size:12px;color:var(--text-3);padding:6px 0}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line-soft)}
.chat-in input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:40px;font-size:13.5px}

/* 幕后 */
.back{position:relative}
.back-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.blk-t{font:600 11px var(--font-mono);letter-spacing:.12em;color:var(--text-3);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.roster{display:flex;gap:8px;flex-wrap:wrap}
.rc{position:relative;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;transition:all .3s;opacity:.65}
.rc i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.rc small{display:none}
.rc.used{opacity:1}
.rc.on{opacity:1;border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 22px -4px var(--c)}
.rc.on i{box-shadow:0 0 10px var(--c);animation:pulse .9s infinite}
.rc.on::after{content:"";position:absolute;inset:-5px;border-radius:13px;border:1px solid var(--c);opacity:0;animation:ringOut 1.6s ease-out infinite}
@keyframes ringOut{0%{opacity:.8;transform:scale(.96)}100%{opacity:0;transform:scale(1.08)}}
.rc.recv{animation:recv .8s var(--ease)}
@keyframes recv{30%{transform:scale(1.08)}}
.rc.idle{opacity:.35}
.flyer{position:fixed;z-index:70;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;background:#d8ffe8;box-shadow:0 0 12px 4px var(--c,var(--accent))}
.guards{display:flex;gap:8px;flex-wrap:wrap}
.gp{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--text-2);transition:all .3s}
.gp i{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.gp em{font-style:normal;font-size:11.5px;color:var(--text-3)}
.gp[data-s="pass"]{border-color:var(--accent-line);color:var(--text)}
.gp[data-s="pass"] i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.gp[data-s="pass"] em{color:var(--accent)}
.gp[data-s="wait"]{border-color:rgba(242,193,78,.6);color:var(--text)}
.gp[data-s="wait"] i{background:var(--amber);animation:pulse .8s infinite}
.gp[data-s="wait"] em{color:var(--amber)}
.gp[data-s="trip"]{border-color:var(--red);color:#fff;background:rgba(255,107,107,.14);box-shadow:0 0 20px -4px var(--red)}
.gp[data-s="trip"] i{background:var(--red);box-shadow:0 0 10px var(--red)}
.gp[data-s="trip"] em{color:var(--red);font-weight:700}
.ctx{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:flex;gap:6px;align-items:baseline;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line-soft);background:var(--surface-2);max-width:100%}
.kv span{color:var(--text-3)}
.kv b{font-family:var(--font-mono);font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv.flash{animation:kvf 1s var(--ease)}
@keyframes kvf{0%{border-color:var(--accent);box-shadow:0 0 14px var(--accent-line)}}
.special{border:1px solid var(--line-soft);border-radius:10px;background:#060b08;padding:10px}
.trace-wrap{flex:1;min-height:120px;display:flex;flex-direction:column}
.trace{position:relative;flex:1;overflow-y:auto;border:1px solid var(--line-soft);border-radius:10px;background:#030604;padding:6px 0;font-size:12.5px}
.tr{display:grid;grid-template-columns:52px 20px minmax(0,1fr);gap:6px;padding:5px 10px;animation:trIn .35s var(--ease) both;border-left:2px solid transparent}
@keyframes trIn{from{opacity:0;transform:translateX(10px);background:rgba(57,255,136,.08)}}
.tr .tt{color:var(--text-3);font:11px var(--font-mono);padding-top:2px}
.tr .ti{text-align:center}
.tr .tb{color:var(--text-2);min-width:0}
.tr .tb b{color:var(--text)}
.tr .fn{font-family:var(--font-mono);color:var(--cyan)}
.tr code{display:block;font:11px var(--font-mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .res{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--text)}
.tr .res em{font:11px var(--font-mono);font-style:normal;color:var(--text-3)}
.tr-tool{border-left-color:var(--cyan)}
.tr-handoff{border-left-color:var(--violet)}
.tr-guard-trip{border-left-color:var(--red);background:rgba(255,107,107,.06)}
.tr-guard-wait,.tr-human{border-left-color:var(--amber)}
.tr-done{border-left-color:var(--accent);background:var(--accent-soft)}
.tr.hl,.hl{animation:hl 1.8s var(--ease)}
@keyframes hl{0%,40%{box-shadow:0 0 0 2px var(--accent),0 0 30px var(--accent-line)}}
.back.trip{animation:shake .45s}
.back.trip::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 2px var(--red),inset 0 0 60px rgba(255,107,107,.35);animation:fade .9s ease-out forwards}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes fade{to{opacity:0}}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;padding:8px 12px;border-radius:10px;border:1px solid var(--accent-line);background:var(--accent-soft);animation:logIn .4s var(--ease) both}
.summary b{font-family:var(--font-mono);color:var(--accent)}

/* 特殊面板：设备看板 */
.fleet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dev{display:flex;flex-direction:column;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;transition:all .4s}
.dev b{font:600 12px var(--font-mono);display:flex;align-items:center;gap:6px}
.dev b i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dev small{color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev[data-s="alarm"]{border-color:rgba(255,107,107,.35)}
.dev[data-s="alarm"] b i{background:var(--red)}
.dev[data-s="work"]{border-color:var(--amber);box-shadow:0 0 16px -4px var(--amber)}
.dev[data-s="work"] b i{background:var(--amber);animation:pulse .7s infinite}
.dev[data-s="fixed"]{border-color:var(--accent);box-shadow:0 0 16px -4px var(--accent)}


/* ── 首页：项目要点开头几个字加粗 ── */
.points li b{color:var(--text);font-weight:600}
.proj-h .kpi small{display:block;max-width:10em;margin-left:auto;line-height:1.4}

/* ── 对话：思考行、检索词、客户简报 ── */
.msg.think{max-width:100%;flex-direction:row;gap:6px;font:12px/1.55 var(--font-mono);color:var(--text-3)}
.msg.think::before{content:"›";color:var(--cyan);font-weight:700}
.chipq{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chipq span{font:12px var(--font-mono);padding:3px 8px;border:1px solid var(--accent-line);border-radius:5px;color:var(--accent);background:var(--accent-soft)}
.outcard h5{font-size:12.5px;color:var(--cyan);margin:10px 0 4px;font-weight:600}
.outcard .bsum{color:var(--text)}
.outcard .vq small{display:block;color:var(--text-3);font-size:12px}
a.fref{text-decoration:none}
.refs{margin-top:10px;border-top:1px dashed var(--line-2);padding-top:8px;font-size:12px;color:var(--text-3)}
.refs summary{cursor:pointer;color:var(--text-2)}
.refs div{margin-top:4px;line-height:1.5}
.refs a{color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}

/* ── 幕后：检索结果 ── */
.queries{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.queries span{font:11.5px var(--font-mono);padding:2px 7px;border-radius:5px;border:1px solid var(--cyan);color:var(--cyan);animation:logIn .35s var(--ease) both}
.news{list-style:none;padding:0;margin:0;display:grid;gap:2px;max-height:184px;overflow-y:auto;font-size:12px;scrollbar-width:thin}
.news li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 6px;border-radius:6px;animation:logIn .35s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.news li.ph{display:block;color:var(--text-3)}
.news .n{font:600 11px var(--font-mono);color:var(--accent);text-align:center}
.news .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.news .t small{color:var(--text-3)}
.news .c{font-size:11px;padding:0 6px;border-radius:4px;color:var(--accent);border:1px solid transparent;white-space:nowrap}
.news .c:not(:empty){border-color:var(--accent-line);animation:logIn .3s var(--ease) both}
.news li.neg{background:rgba(255,107,107,.06)}
.news li.neg .t{text-decoration:line-through;color:var(--text-3)}
.news li.neg .c{color:var(--red);border-color:rgba(255,107,107,.5)}
.news li.irr{opacity:.45}
.news li.irr .c{color:var(--text-3);border-color:var(--line)}

/* ── 幕后：模拟后台 ── */
.adm .f{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.adm .f span{font-size:11.5px;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--text-3);transition:all .3s}
.adm .f span.set{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px -2px var(--accent-line)}
.adm table{width:100%;border-collapse:collapse;font:12px var(--font-mono)}
.adm td{padding:3px 6px;border-bottom:1px solid var(--line-soft);color:var(--text-2);transition:background .3s}
.adm tr.sel td{background:var(--accent-soft);color:var(--text)}
.adm tr.chg td:last-child{color:var(--accent);font-weight:700}
.adm .ph{font-size:12px;color:var(--text-3)}
.adm .modal{margin-top:6px;font-size:12px;padding:6px 8px;border-radius:7px;border:1px solid var(--cyan);color:var(--text);animation:logIn .3s var(--ease) both}
.adm .modal.cf{border-color:var(--amber);color:var(--amber);animation:logIn .3s var(--ease) both,waitGlow 1.4s ease-in-out infinite}
.adm .modal.okm{border-color:var(--accent);color:var(--accent)}
.adm .wos{margin-top:6px;font:11.5px var(--font-mono);color:var(--accent);display:grid;gap:2px}

/* ── 实时运行：输入区 ── */
.chat-in{flex-wrap:wrap;align-items:center}
.chat-in .devs{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chat-in .devs button{font:12px var(--font-mono);padding:5px 9px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2)}
.chat-in .devs button.alarm{border-color:rgba(255,107,107,.5)}
.chat-in .devs button.alarm::before{content:"● ";color:var(--red)}
.chat-in .devs button:hover:not([disabled]){border-color:var(--accent);color:var(--text)}
.chat-in .devs button[disabled]{opacity:.45;cursor:not-allowed}
.chat-in .btn.primary{flex:none}

/* ── 试用栏 ── */
.try{margin-top:12px;padding:14px 16px;display:grid;gap:10px;border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-soft),0 10px 40px -24px var(--accent)}
.try .row{display:flex;gap:10px;flex-wrap:wrap}
.try input{flex:1;min-width:200px;min-height:46px;background:#030604;border:1px solid var(--line-2);border-radius:10px;padding:0 14px;font-size:16px;color:var(--text)}
.try input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.try .btn.primary{min-height:46px;padding:0 20px;font-size:15px}
.try .sug{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--text-3)}
.try .sug button,.try .sug a{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);transition:border-color .2s,color .2s}
.try .sug button:hover:not([disabled]),.try .sug a:hover{border-color:var(--accent);color:var(--accent)}
.try .devs button{font-family:var(--font-mono);font-size:12px}
.try .devs button.alarm::before{content:"● ";color:var(--red)}
.try [disabled]{opacity:.45;cursor:not-allowed}

/* ═════════════ AI 工具页 ═════════════ */
.tool{margin-top:14px;padding:20px 22px;display:grid;gap:16px;border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-soft),0 18px 60px -30px var(--accent)}
.tool-h h2{font-size:clamp(22px,2.6vw,28px);color:var(--accent);text-shadow:0 0 22px var(--accent-line)}
.tool-h p{margin-top:6px;color:var(--text);font-size:15.5px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px 12px}
.facts span{font:600 11.5px var(--font-mono);letter-spacing:.12em;color:var(--accent)}
.facts p{margin-top:4px;font-size:14px;color:var(--text-2)}
.tool .try{margin:0;padding:0;border:0;box-shadow:none;background:none}
.tool .try input.narrow{flex:0 1 220px;min-width:160px}
.off{font-size:13px;color:var(--amber)}
.steps-row{display:flex;align-items:center;gap:14px;margin:18px 0 12px;scroll-margin-top:76px}
.steps{flex:1;--step:.6s}
.steps .fnode{animation:none;font-weight:600}
.steps.busy .fnode{animation:nodeOn calc(var(--n) * var(--step)) linear infinite;animation-delay:calc(var(--i) * var(--step))}
.steps .flink::after{animation:none;opacity:0}
.steps.busy .flink::after{opacity:1;animation:packet calc(var(--n) * var(--step)) linear infinite;animation-delay:calc(var(--i) * var(--step) + var(--step) * .3)}
.steps .fnode.done{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.timer{font:12.5px var(--font-mono);color:var(--text-3);min-width:64px;text-align:right}
.result{padding:18px 22px 22px;animation:logIn .4s var(--ease) both}
.res-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line-soft)}
.res-h .who{font-weight:700;color:var(--text);font-size:16px}
.res-h .note{font:12.5px var(--font-mono);color:var(--accent)}
.res-h .btn{margin-left:auto}
.res-b{display:grid;gap:12px;font-size:14.5px;line-height:1.7}
.res-b>*{animation:logIn .45s var(--ease) both}
.res-b h4{font:600 13px var(--font-mono);letter-spacing:.06em;color:var(--accent);margin-top:6px}
.res-b .sum{font-size:16px;color:var(--text);padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.res-b .blk{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px}
.res-b .blk h4{margin:0 0 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
ul.dots{list-style:none;padding:0;display:grid;gap:6px}
ul.dots li{position:relative;padding-left:14px;color:var(--text-2)}
ul.dots li::before{content:"";position:absolute;left:2px;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
ul.dots li b,ol.nums li b{color:var(--text);font-weight:600;margin-right:6px}
ul.dots small,ol.nums small{display:block;color:var(--text-3);font-size:13px}
ol.nums{padding-left:20px;display:grid;gap:6px;color:var(--text-2)}
.srcs{font-size:13px;color:var(--text-3);border-top:1px dashed var(--line-2);padding-top:10px}
.srcs summary{cursor:pointer;color:var(--text-2)}
.srcs div{margin-top:4px;line-height:1.5}
.srcs a{color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.lv,.tag{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:6px;font:700 12px var(--font-mono);border:1px solid}
.lv.hi,.tag.hi{color:var(--red);border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
.lv.md,.tag.md{color:var(--amber);border-color:rgba(242,193,78,.5);background:rgba(242,193,78,.07)}
.lv.lo,.tag.lo{color:var(--text-2);border-color:var(--line-2)}
.tag{margin-right:6px;font-size:11px;height:19px}
.causes{display:grid;gap:8px}
.cause{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px}
.cause b{color:var(--text)}
.cause p{color:var(--text-2);font-size:14px}
.cause .chk{color:var(--text-3);font-size:13px}
.onsite{margin-top:8px;font-size:13.5px;color:var(--text-2)}
.ticket dl{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;font-size:14px}
.ticket dt{color:var(--text-3)}
.ticket dd{margin:0;color:var(--text)}
.ticket .chips span{margin:0 6px 4px 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th{font:600 12px var(--font-mono);color:var(--text-3);text-align:left;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-soft);color:var(--text-2)}
.tbl td:first-child{color:var(--text);font-weight:600}
.tbl .mono{font-family:var(--font-mono);font-size:12.5px;color:var(--cyan)}
.kv2{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv2 dt{color:var(--text-3)}
.kv2 dd{margin:0;color:var(--text-2)}
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mod{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;font-size:13.5px}
.mod em{font:600 11px var(--font-mono);font-style:normal;color:var(--cyan)}
.mod b{display:block;color:var(--text);margin:2px 0 4px}
.mod ul{padding-left:16px;color:var(--text-2)}
.rules{display:grid;gap:6px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 12px;font-size:13.5px;color:var(--text-2)}
.rule i{font-style:normal;color:var(--accent);text-align:center}
.phases{display:grid;gap:8px}
.ph b{display:flex;gap:8px;align-items:baseline;color:var(--text)}
.ph b em{font:12px var(--font-mono);font-style:normal;color:var(--accent)}
.ph p{color:var(--text-2);font-size:13.5px}
.wait{color:var(--text-3);display:flex;align-items:center;gap:8px}
.err{color:#ffc0c0;border:1px solid rgba(255,107,107,.45);background:rgba(255,107,107,.08);border-radius:10px;padding:10px 12px}
@media (max-width:900px){
  .facts,.grid2{grid-template-columns:1fr}
  .mods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rule{grid-template-columns:1fr;gap:2px}
  .rule i{text-align:left;transform:rotate(90deg);width:14px}
  .tool .try input.narrow{flex:1 1 100%}
}
@media (max-width:640px){
  .mods{grid-template-columns:1fr}
  .tool{padding:16px}
  .result{padding:14px 16px 18px}
  .steps-row{flex-wrap:wrap}
  .steps .fnode{font-size:11px;padding:6px 3px}
}
@media (max-width:640px){
  .facts{gap:4px}
  .facts div{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border:0;background:none;border-left:2px solid var(--accent-line);border-radius:0}
  .facts p{margin:0;font-size:13.5px}
  .tool-h p{font-size:14.5px}
}

/* ── 响应式 ── */
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .radar{margin:0 auto;width:min(80%,320px)}
  .teasers,.projects,.skills{grid-template-columns:1fr}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .num:nth-child(3){border-left:0}
  .num:nth-child(n+3){border-top:1px solid var(--line-soft)}
}
@media (max-width:900px){
  .atabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .atab{flex:none}
  .atabs::-webkit-scrollbar{display:none}
  .bench{grid-template-columns:1fr;height:calc(100svh - 70px);min-height:520px;grid-template-rows:auto minmax(0,1fr);gap:0}
  .mtabs{display:flex;border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;overflow:hidden;background:var(--surface)}
  .mtabs button{flex:1;background:none;border:0;min-height:42px;font-size:14px;color:var(--text-2);position:relative}
  .mtabs button[aria-selected="true"]{color:var(--accent);font-weight:600;box-shadow:inset 0 -2px var(--accent)}
  .mtabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 11px var(--font-mono)}
  .mtabs button.alarm{animation:tabAlarm .9s 2}
  @keyframes tabAlarm{50%{background:rgba(255,107,107,.25)}}
  .bench .pane{border-radius:0 0 var(--r) var(--r)}
  .bench[data-pane="chat"] .back,.bench[data-pane="back"] .chatpane{display:none}
  .ticker{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line-soft);font:11.5px var(--font-mono);color:var(--text-3);background:#030604;white-space:nowrap;overflow:hidden}
  .ticker span{overflow:hidden;text-overflow:ellipsis}
  .ticker b{color:var(--accent);font-weight:600;flex:none}
  .pane-h .r{display:none}
}
@media (max-width:640px){
  .nav .btn{display:none}
  .links a[href="#projects"],.links a[href="#exp"],.links a[href="#skills"]{display:none}
  .links a{padding:7px 8px}
  .links .sep{margin:0 2px}
  .hero{padding-top:36px}
  .num{padding:14px}
  .proj-h{flex-wrap:wrap}
  .proj-h .kpi{margin-left:0;text-align:left;width:100%;display:flex;align-items:baseline;gap:8px}
  .fleet{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctl .state{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:640px){
  .news li{grid-template-columns:20px minmax(0,1fr) auto}
  .chat-in .devs button{font-size:11.5px;padding:4px 7px}
}
</style>

<body>
<div id="progress"></div>

<header class="nav"><div class="shell">
  <a class="brand" href="#/"><i></i>朱先生</a>
  <nav class="links" aria-label="主导航">
    <a href="#/" data-r="home">首页</a>
    <a href="#projects" data-r="home">项目</a>
    <a href="#exp" data-r="home">经历</a>
    <a href="#skills" data-r="home">技能</a>
    <span class="sep"></span>
    <a href="#/agents" class="lab" data-r="agents">AI 工具<em>LIVE</em></a>
  </nav>
  <a class="btn sm" href="pdf/朱先生简历.pdf" target="_blank" rel="noopener">简历 PDF</a>
</div></header>

<!-- ═════════════ 首页 ═════════════ -->
<main id="home">
  <section class="hero" id="top">
    <canvas id="net" aria-hidden="true"></canvas>
    <div class="shell hero-grid">
      <div>
        <div class="kicker">PRODUCT DIRECTOR · SHANGHAI</div>
        <h1>朱先生<span class="role">产品总监 · <span id="typed"></span><i class="caret" aria-hidden="true"></i></span></h1>
        <p class="lead" id="lead"></p>
        <div class="cta">
          <a class="btn primary" href="#/agents">使用 3 个 AI 工具 →</a>
          <a class="btn" href="#projects">看项目</a>
        </div>
      </div>
      <div class="radar" id="radar" aria-hidden="true"></div>
    </div>
    <div class="shell"><div class="nums card rv" id="nums"></div></div>
  </section>

  <section class="shell" id="teaser">
    <div class="sec-h rv"><h2 class="scr">AI 工具</h2><span class="en">AI TOOLS</span></div>
    <div class="teasers" id="teasers"></div>
  </section>

  <section class="shell" id="projects">
    <div class="sec-h rv"><h2 class="scr">项目</h2><span class="en">PROJECTS</span></div>
    <div class="projects" id="projList"></div>
  </section>

  <section class="shell" id="exp">
    <div class="sec-h rv"><h2 class="scr">工作经历</h2><span class="en">EXPERIENCE</span></div>
    <div class="tl" id="tl"><div class="tl-track"><i id="tlFill"></i></div></div>
  </section>

  <section class="shell" id="skills">
    <div class="sec-h rv"><h2 class="scr">技能</h2><span class="en">SKILLS</span></div>
    <div class="marquee rv" style="--i:1"><div class="track" id="marq"></div></div>
    <div class="skills" id="skillList"></div>
  </section>

  <section class="shell" id="contact">
    <div class="card contact glow rv">
      <div><p id="intent"></p><b id="email"></b></div>
      <a class="btn primary" id="mailBtn" href="#">发邮件</a>
    </div>
  </section>
  <footer id="foot"></footer>
</main>

<!-- ═════════════ AI 工具 ═════════════ -->
<main id="lab" hidden>
  <section class="shell lab-head">
    <div class="kicker">AI TOOLS</div>
    <h1>AI 工具 · <span>可直接使用</span></h1>
  </section>

  <section class="shell lab-sec">
    <div class="atabs" role="tablist" id="atabs"></div>
    <div class="tool card glow" id="tool">
      <div class="tool-h"><h2 id="tName"></h2><p id="tRes"></p></div>
      <div class="facts" id="tFacts"></div>
      <div class="try" id="tryBar"></div>
      <p class="off" id="offNote" hidden>在线使用暂时不可用，下面是示例结果。</p>
    </div>
    <div class="steps-row"><div class="flow steps" id="steps"></div><span class="timer" id="timer"></span></div>
    <div class="result card" id="result"></div>
  </section>
  <footer id="foot2"></footer>
</main>

<script src="assets/config.js"></script>
<script src="data/resume.js"></script>
<script src="assets/examples.js"></script>
<script>
(() => {
"use strict";
document.documentElement.classList.add("js");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ═════════════ 数据：简历（data/resume.js，和 PDF 共用）+ 回放（assets/replays.js，真实运行录制） ═════════════ */
const R = window.RESUME, EX = window.EXAMPLES;
const API = (window.SITE && window.SITE.api) || "";
const KEYS = ["intel", "diag", "plan"]; // 销售 → 售后 → 产品
const AG = Object.fromEntries(R.agents.map((a) => [a.key, a]));
const BLIPS = [
  { k: "电信运营商", a: 32, r: 0.78 }, { k: "物流车联网", a: 112, r: 0.62 }, { k: "长租公寓 IoT", a: 168, r: 0.8 },
  { k: "茶饮设备", a: 236, r: 0.66 }, { k: "AI Agent", a: 308, r: 0.5 }
];
// “出液控制：……” → 冒号前加粗
const leadB = (s) => { const m = String(s).match(/^([^：]{2,9})：(.*)$/); return m ? `<b>${esc(m[1])}：</b>${esc(m[2])}` : esc(s); };

/* ═════════════ 首页渲染 ═════════════ */
$("#lead").textContent = R.intro;
$("#nums").innerHTML = R.numbers.map((n) => `<div class="num"><b><span data-to="${n.to}">0</span><small>${esc(n.unit)}</small></b><span>${esc(n.label)}</span></div>`).join("");
$("#teasers").innerHTML = KEYS.map((k, i) => {
  const a = AG[k];
  return `<a class="card teaser glow rv" style="--i:${i}" href="#/agents/${k}"><span class="no">TOOL ${a.no} · ${esc(a.tag)}</span><h3>${esc(a.t)}</h3><p>${esc(a.res)}</p><div class="mini" data-k="${k}"></div><span class="go">立即使用 <i>→</i></span></a>`;
}).join("");
$("#projList").innerHTML = R.projects.map((p, i) => `
  <article class="card proj glow rv" style="--i:${i % 2}">
    <div class="proj-h"><div><span class="no">P${i + 1}</span><h3>${esc(p.title)}</h3><div class="meta">${esc(p.org)} · ${esc(p.role)} · ${esc(p.time)}</div></div><div class="kpi"><b>${esc(p.kpis[0][0])}</b><small>${esc(p.kpis[0][1])}</small></div></div>
    <div class="flow" style="--n:${p.flow.length}">${p.flow.map((f, j) => (j ? `<span class="flink" style="--i:${j - 1}"></span>` : "") + `<span class="fnode" style="--i:${j}">${esc(f)}</span>`).join("")}</div>
    <ul class="points">${p.points.map((x) => `<li>${leadB(x)}</li>`).join("")}</ul>
  </article>`).join("");
$("#tl").insertAdjacentHTML("beforeend", R.experience.map((e) => `<div class="tli rv"><div class="t">${esc(e.time)}</div><h3>${esc(e.org)}<span>${esc(e.role)}</span></h3><p>${esc(e.d)}</p></div>`).join("")
  + `<div class="tli rv"><div class="t">${esc(R.education.time)}</div><h3>${esc(R.education.school)}<span>${esc(R.education.degree)}</span></h3><p>${esc(R.education.major)}</p></div>`);
const marqItems = R.skills.flatMap((s) => s.v);
const marqHTML = marqItems.map((x, i) => `<span class="${i % 4 === 0 ? "hot" : ""}">${esc(x)}</span>`).join("");
$("#marq").innerHTML = marqHTML + marqHTML;
$("#skillList").innerHTML = R.skills.map((s, i) => `<div class="card skill glow rv" style="--i:${i}"><h3>${esc(s.k)}</h3><div class="chips">${s.v.map((v) => `<span>${esc(v)}</span>`).join("")}</div></div>`).join("");
$("#intent").textContent = `求职意向：${R.intent} · ${R.city}`;
$("#email").textContent = R.contact.email;
$("#mailBtn").href = "mailto:" + R.contact.email;
$("#foot").textContent = $("#foot2").textContent = `${R.name} · ${R.title}`;

/* 雷达 */
(() => {
  const host = $("#radar"), NS = "http://www.w3.org/2000/svg";
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const s = el("svg", { viewBox: "0 0 200 200" });
  [92, 70, 48, 26].forEach((r, i) => s.appendChild(el("circle", { cx: 100, cy: 100, r, fill: "none", stroke: i ? "#193a29" : "#2a5a40", "stroke-dasharray": i % 2 ? "2 3" : "" })));
  s.appendChild(el("line", { x1: 8, y1: 100, x2: 192, y2: 100, stroke: "#11261a" }));
  s.appendChild(el("line", { x1: 100, y1: 8, x2: 100, y2: 192, stroke: "#11261a" }));
  for (let d = 0; d < 360; d += 10) {
    const a = d * Math.PI / 180, r1 = d % 30 ? 89 : 85;
    s.appendChild(el("line", { x1: 100 + Math.sin(a) * r1, y1: 100 - Math.cos(a) * r1, x2: 100 + Math.sin(a) * 92, y2: 100 - Math.cos(a) * 92, stroke: "#2a5a40" }));
  }
  host.appendChild(s);
  host.appendChild(mk("div", "sw"));
  host.insertAdjacentHTML("beforeend", '<div class="radar-core"><b>AIoT</b>2017 → NOW</div>');
  BLIPS.forEach((b) => {
    const a = b.a * Math.PI / 180, Rr = 46 * b.r;
    const n = mk("div", "blip" + (b.a > 180 ? " l" : ""), `<i></i><span>${b.k}</span>`);
    n.style.left = 50 + Math.sin(a) * Rr + "%"; n.style.top = 50 - Math.cos(a) * Rr + "%";
    n.style.setProperty("--t", (b.a / 360 * 6).toFixed(2) + "s");
    host.appendChild(n);
  });
})();

/* 打字：职位方向循环 */
(() => {
  const t = $("#typed"), words = ["出茶机等智能硬件", "IoT 设备管理平台", "AI Agent 产品"];
  if (RM) { t.textContent = words.join(" / "); return; }
  let w = 0, i = 0, del = false;
  (function step() {
    const word = words[w];
    i += del ? -1 : 1;
    t.textContent = word.slice(0, i);
    let delay = del ? 45 : 110 + Math.random() * 60;
    if (!del && i === word.length) { del = true; delay = 1800; }
    else if (del && i === 0) { del = false; w = (w + 1) % words.length; delay = 400; }
    setTimeout(step, delay);
  })();
})();

/* 数字滚动、标题解码、进场 */
function countUp(node) {
  const to = +node.dataset.to;
  if (RM) { node.textContent = to; return; }
  let t0 = 0;
  requestAnimationFrame(function f(ts) {
    if (!t0) t0 = ts;
    const p = Math.min(1, (ts - t0) / 1600), e = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(to * e);
    if (p < 1) requestAnimationFrame(f);
  });
}
function scramble(node) {
  const final = node.dataset.t || node.textContent;
  node.dataset.t = final;
  if (RM) return;
  const pool = "01<>/#_*+=ABCDEFxyz", L = final.length;
  let f = 0;
  const iv = setInterval(() => {
    f++;
    let out = "";
    for (let i = 0; i < L; i++) out += i < f / 3 ? final[i] : final[i] === " " ? " " : pool[(Math.random() * pool.length) | 0];
    node.textContent = out;
    if (f / 3 >= L) { clearInterval(iv); node.textContent = final; }
  }, 45);
}
const io = new IntersectionObserver((ents) => {
  ents.forEach((en) => {
    if (!en.isIntersecting) return;
    const n = en.target;
    n.classList.add("in");
    io.unobserve(n);
    $$("[data-to]", n).forEach(countUp);
    $$(".scr", n).forEach(scramble);
    if (n.matches(".scr")) scramble(n);
  });
}, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });
$$(".rv").forEach((n) => io.observe(n));

/* 首页工具卡片里的小终端（内容取自示例结果） */
const TEASER = {
  intel: () => { const b = EX.intel.brief; return [["", "? " + EX.intel.input.name], ["c", `› 相关报道 ${EX.intel.news} 条`], ["", "✓ " + b.sections.map((x) => x.cat + " " + x.points.length).join(" · ")], ["g", `✓ 拜访话题 ${b.visit.length} 个`]]; },
  diag: () => { const r = EX.diag.result, i = EX.diag.input; return [["", `? ${i.device}：${i.symptom}`], ["c", `› 可能原因 ${r.causes.length} 个`], ["", `  1. ${r.causes[0].cause} · ${r.causes[0].level}`], ["", `✓ 先做 ${r.steps.length} 步排查`], ["g", `✓ 工单：${r.ticket.title}`]]; },
  plan: () => { const m = EX.plan.model, o = EX.plan.ops; return [["", "? " + EX.plan.input.device], ["c", `› 物模型 ${m.properties.length} 个属性 · ${m.events.length} 个事件`], ["", `› 平台功能 ${o.modules.length} 个模块`], ["", `✓ 自动规则 ${o.rules.length} 条`], ["g", `✓ ${o.phases[0].phase} ${o.phases[0].weeks}上线`]]; }
};
(() => {
  $$(".mini").forEach((box) => {
    const lines = TEASER[box.dataset.k]();
    if (RM) { box.innerHTML = lines.map(([c, t]) => `<div class="${c}">${esc(t)}</div>`).join(""); return; }
    let i = 0;
    (function tick() {
      if (i === 0) box.innerHTML = "";
      const [c, t] = lines[i];
      box.appendChild(mk("div", c, esc(t)));
      if (box.children.length > 5) box.firstChild.remove();
      i = (i + 1) % lines.length;
      setTimeout(tick, i === 0 ? 2600 : 900);
    })();
  });
})();

/* 卡片光斑跟随鼠标 */
document.addEventListener("pointermove", (e) => {
  const c = e.target.closest && e.target.closest(".glow");
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", e.clientX - r.left + "px");

/* 首屏背景：设备网络 */
const Net = (() => {
  const cv = $("#net"), ctx = cv.getContext("2d"), hero = $(".hero");
  let W = 0, H = 0, N = [], P = [], rings = [], m = { x: -9999, y: -9999 }, active = true, inView = true, raf = 0;
  const LINK = 130;
  function size() {
    const d = Math.min(2, devicePixelRatio || 1), r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    if (!W || !H) return;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.max(30, Math.min(95, Math.round((W * H) / 14000)));
    N = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 1.3 + 0.8, hub: Math.random() < 0.14, ph: Math.random() * 6 }));
    P = []; rings = [];
  }
  function draw(ts) {
    ctx.clearRect(0, 0, W, H);
    for (const a of N) {
      a.x += a.vx; a.y += a.vy;
      if (a.x < 0 || a.x > W) a.vx *= -1;
      if (a.y < 0 || a.y > H) a.vy *= -1;
    }
    ctx.lineWidth = 1;
    for (let i = 0; i < N.length; i++) {
      const a = N[i];
      for (let j = i + 1; j < N.length; j++) {
        const b = N[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
        if (d > LINK) continue;
        let al = (1 - d / LINK) * 0.22;
        const md = Math.hypot((a.x + b.x) / 2 - m.x, (a.y + b.y) / 2 - m.y);
        if (md < 200) al += (1 - md / 200) * 0.55;
        ctx.strokeStyle = `rgba(57,255,136,${al.toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        if (P.length < 16 && Math.random() < 0.0012) P.push({ a: i, b: j, t: 0, s: 0.006 + Math.random() * 0.012 });
      }
    }
    P = P.filter((p) => {
      p.t += p.s;
      const a = N[p.a], b = N[p.b];
      if (p.t >= 1 || Math.hypot(a.x - b.x, a.y - b.y) > LINK * 1.15) return false;
      const x = a.x + (b.x - a.x) * p.t, y = a.y + (b.y - a.y) * p.t;
      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7);
      ctx.fillStyle = "#c8ffdf"; ctx.shadowColor = "#39ff88"; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
      return true;
    });
    rings = rings.filter((g) => {
      g.r += 4.5; g.al -= 0.012;
      if (g.al <= 0) return false;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, 7);
      ctx.strokeStyle = `rgba(57,255,136,${g.al.toFixed(3)})`; ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1;
      return true;
    });
    for (const a of N) {
      const md = Math.hypot(a.x - m.x, a.y - m.y);
      let lit = md < 150;
      for (const g of rings) if (Math.abs(Math.hypot(a.x - g.x, a.y - g.y) - g.r) < 14) lit = true;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r + (lit ? 1.3 : 0) + (a.hub ? 0.9 : 0), 0, 7);
      ctx.fillStyle = a.hub || lit ? "#39ff88" : "rgba(160,220,185,.5)"; ctx.fill();
      if (a.hub) {
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 5 + Math.sin(ts / 600 + a.ph) * 1.6, 0, 7);
        ctx.strokeStyle = "rgba(57,255,136,.28)"; ctx.stroke();
      }
    }
  }
  function loop(ts) { raf = 0; if (!active || !inView || document.hidden) return; draw(ts); raf = requestAnimationFrame(loop); }
  function kick() { if (!raf && active && inView && !document.hidden && !RM) raf = requestAnimationFrame(loop); }
  size();
  if (RM) draw(0);
  addEventListener("resize", () => { size(); if (RM) draw(0); });
  hero.addEventListener("pointermove", (e) => { const r = cv.getBoundingClientRect(); m.x = e.clientX - r.left; m.y = e.clientY - r.top; }, { passive: true });
  hero.addEventListener("pointerleave", () => { m.x = m.y = -9999; });
  hero.addEventListener("click", (e) => {
    if (e.target.closest("a,button")) return;
    const r = cv.getBoundingClientRect();
    rings.push({ x: e.clientX - r.left, y: e.clientY - r.top, r: 4, al: 0.7 });
  });
  new IntersectionObserver((en) => { inView = en[0].isIntersecting; kick(); }).observe(hero);
  document.addEventListener("visibilitychange", kick);
  kick();
  return { on() { active = true; size(); kick(); }, off() { active = false; } };
})();

/* ---------- 进度条（业务步骤） ---------- */
function setSteps(k, state, upto = -1) {
  const st = TOOLS[k].steps;

function stepOn(upto) { $$(".fnode", stepsEl).forEach((n, j) => n.classList.toggle("done", j <= upto)); }

/* ---------- 运行 ---------- */
const post = (path, body) => fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const asJSON = (r) => r.json().catch(() => ({ error: "服务返回异常（HTTP " + r.status + "）" }));
async function readStream(resp, g, onEv) {
  const rd = resp.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) { const l = buf.slice(0, i); buf = buf.slice(i + 1); if (l.trim() && g === T.gen) onEv(JSON.parse(l)); }
  }
}
async function run(k, body) {
  const tool = TOOLS[k];
  if (T.busy || !T.liveOK || !tool.ok(body)) { if (!tool.ok(body)) $("#fA").focus(); return; }
  const g = ++T.gen; T.busy = true; lock(true);
  setSteps(k, "busy"); startTimer();
  const out = resultShell(tool.label(body), "生成中…");
  out.innerHTML = `<p class="wait"><span class="spin"></span>正在生成</p>`;
  $(".steps-row").scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" });
  const fail = (msg) => { out.innerHTML = `<p class="err">${esc(msg)}</p>`; };
  let finished = false;
  try {
    if (k === "diag") {
      stepOn(0);
      const r = await asJSON(await post("/api/diag", body));
      if (g !== T.gen) return;
      if (r.error) fail(r.error); else if (!r.ok) fail(r.reply); else { out.innerHTML = diagHTML(r.result); finished = true; }
    } else {
      const resp = await post(k === "intel" ? "/api/intel" : "/api/plan", body);
      if (!resp.ok) { const j = await asJSON(resp); fail(j.error || "HTTP " + resp.status); }
      else {
        let said = "", newsN = 0;
        await readStream(resp, g, (e) => {
          if (k === "intel") {
            if (e.t === "plan" || e.fn === "search_news") stepOn(0);
            if (e.fn === "dedupe" || e.fn === "filter_subject") stepOn(1);
            if (e.t === "news") { newsN = e.items.filter((x) => !x.masked).length; stepOn(1); $("#resNote").textContent = `找到 ${newsN} 条相关报道，正在归类…`; }
            if (e.t === "classify") stepOn(2);
            if (e.t === "say") said = e.text;
            if (e.t === "brief") { stepOn(3); out.innerHTML = intelHTML(e); finished = true; }
          } else {
            if (e.t === "start") stepOn(0);
            if (e.t === "refuse") said = e.text;
            if (e.t === "part" && e.k === "model") { stepOn(1); out.innerHTML = planModelHTML(e.data) + `<p class="wait"><span class="spin"></span>正在生成平台功能和分期计划</p>`; }
            if (e.t === "part" && e.k === "ops") { stepOn(3); $(".wait", out)?.remove(); out.insertAdjacentHTML("beforeend", planOpsHTML(e.data)); finished = true; }
          }
          if (e.t === "error") said = e.text;
        });
        if (g !== T.gen) return;
        if (!finished) fail(said || "这次没有生成结果，换个说法再试一次。");
      }
    }
  } catch { if (g === T.gen) fail("网络出错，请稍后再试。"); }
  if (g !== T.gen) return;
  stopTimer();
  setSteps(k, finished ? "done" : "idle");
  $("#resNote").textContent = finished ? `已生成 · ${((Date.now() - T.t0) / 1000).toFixed(1)} 秒` : "";
  T.busy = false; lock(false);
}

/* ═════════════ 路由 ═════════════ */
function route() {
  const h = location.hash || "#/";
  const lab = h.startsWith("#/agents");
  $("#home").hidden = lab; $("#lab").hidden = !lab;
  $$(".links a").forEach((a) => {
    const cur = lab ? a.dataset.r === "agents" : a.getAttribute("href") === (h === "#/" || h === "#top" ? "#/" : h);
    cur ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  if (lab) {
    Net.off();
    const k = h.split("/")[2];
    scrollTo(0, 0);
    if (!T.busy) selectTool(TOOLS[k] ? k : T.cur);
  } else {
    Net.on();
    const id = h.slice(1);
    if (id && id !== "/" && document.getElementById(id)) requestAnimationFrame(() => document.getElementById(id).scrollIntoView());
    else if (h === "#/") scrollTo(0, 0);
  }
}
addEventListener("hashchange", route);
route();
})();
</script>
